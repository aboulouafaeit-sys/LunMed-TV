name: LunMed TV CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest :core:core-model:test --continue

      - name: Assemble Minified Release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify APK Size Budget (<= 2.0 MB)
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$APK_PATH")
          MAX_SIZE=2097152 # 2.0 MB in bytes
          
          echo "Release APK Size: $APK_SIZE bytes ($(($APK_SIZE / 1024)) KB)"
          echo "Maximum Allowed Size: $MAX_SIZE bytes (2048 KB)"
          
          if [ "$APK_SIZE" -gt "$MAX_SIZE" ]; then
            echo "FAILED: Release APK exceeded size budget of 2.0 MB!"
            exit 1
          else
            echo "SUCCESS: Release APK is within strict size budget."
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunmed-tv-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

